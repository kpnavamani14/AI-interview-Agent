<!DOCTYPE html>
<html>
<head>
    <title>AI Interview Agent</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            text-align: center;
            padding: 40px;
        }

        .container {
            background: white;
            max-width: 700px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
        }

        textarea {
            width: 95%;
            height: 150px;
            padding: 15px;
            font-size: 16px;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
        }

        #result {
            margin-top: 25px;
            padding: 20px;
            text-align: left;
            white-space: pre-wrap;
        }

        #progress {
            color: gray;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🤖 AI Interview Agent</h1>

    <p id="progress">Question 1 of 5</p>

    <h2 id="question">Loading question...</h2>

    <textarea id="answer"
        placeholder="Type your answer here..."></textarea>

    <br>

    <button onclick="submitAnswer()">
        Submit Answer
    </button>

    <button onclick="nextQuestion()" id="nextButton" style="display:none;">
        Next Question
    </button>

    <div id="result"></div>

</div>


<script>

let currentQuestion = 0;
const totalQuestions = 5;


// Load question
async function loadQuestion() {

    const response = await fetch("/question/" + currentQuestion);

    const data = await response.json();

    document.getElementById("question").innerText = data.question;

    document.getElementById("progress").innerText =
        "Question " + (currentQuestion + 1) +
        " of " + totalQuestions;

    document.getElementById("answer").value = "";

    document.getElementById("result").innerText = "";

    document.getElementById("nextButton").style.display = "none";
}


// Submit answer
async function submitAnswer() {

    const answer =
        document.getElementById("answer").value.trim();

    const result =
        document.getElementById("result");

    if (answer === "") {

        result.innerText =
            "⚠️ Please type your answer first.";

        return;
    }

    result.innerText =
        "⏳ Evaluating your answer...";

    try {

        const response = await fetch("/answer", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                answer: answer,

                question_number: currentQuestion

            })

        });

        const data = await response.json();

        result.innerText = data.result;

        document.getElementById("nextButton")
            .style.display = "inline-block";

    }

    catch (error) {

        result.innerText =
            "❌ Server error. Check VS Code Terminal.";

        console.error(error);
    }
}


// Next question
function nextQuestion() {

    currentQuestion++;
if (currentQuestion >= totalQuestions) {

    document.getElementById("question")
        .innerText = "🎉 Interview Completed!";

    document.getElementById("progress")
        .innerText = "Completed";

    document.getElementById("answer")
        .style.display = "none";

    document.querySelector("button")
        .style.display = "none";

    document.getElementById("nextButton")
        .style.display = "none";

    fetch("/final-score")
        .then(response => response.json())
        .then(data => {

            document.getElementById("result").innerText =
                "🎯 FINAL INTERVIEW SCORE\n\n" +
                data.score + " / 10\n\n" +
                "Questions answered: " +
                data.answered + " / " +
                data.total;

        });

    return;
}
   
    loadQuestion();
}


// Load first question
loadQuestion();

</script>

</body>
</html>
