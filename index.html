```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Interview Agent</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            text-align: center;
            padding: 40px;
        }

        .container {
            background: white;
            max-width: 700px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
        }

        textarea {
            width: 95%;
            height: 150px;
            padding: 15px;
            font-size: 16px;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
        }

        #result {
            margin-top: 25px;
            padding: 20px;
            text-align: left;
            white-space: pre-wrap;
        }

        #progress {
            color: gray;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🤖 AI Interview Agent</h1>

        <p id="progress">Question 1 of 5</p>

        <h2 id="question">Loading question...</h2>

        <textarea id="answer"
            placeholder="Type your answer here..."></textarea>

        <br>

        <button onclick="submitAnswer()">
            Submit Answer
        </button>

        <button onclick="nextQuestion()" id="nextButton" style="display:none;">
            Next Question
        </button>

        <div id="result"></div>

    </div>


    <script>

        let currentQuestion = 0;
        const totalQuestions = 5;


        // Load question
        function loadQuestion() {

            fetch(`/question/${currentQuestion}`)
                .then(response => response.json())
                .then(data => {

                    document.getElementById("question").innerText =
                        data.question;

                    document.getElementById("progress").innerText =
                        `Question ${currentQuestion + 1} of ${totalQuestions}`;

                });
        }


        // Submit answer
        function submitAnswer() {

            const answer =
                document.getElementById("answer").value.trim();

            if (!answer) {

                alert("Please enter your answer.");

                return;
            }


            fetch("/answer", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    answer: answer
                })

            })

            .then(response => response.json())

            .then(data => {

                document.getElementById("result").innerText =
                    data.result;

                document.getElementById("nextButton").style.display =
                    "inline-block";

            });
        }


        // Next question
        function nextQuestion() {

            currentQuestion++;

            document.getElementById("answer").value = "";

            document.getElementById("result").innerText = "";

            document.getElementById("nextButton").style.display =
                "none";


            if (currentQuestion < totalQuestions) {

                loadQuestion();

            } else {

                showFinalScore();

            }
        }


        // Show final score
        function showFinalScore() {

            fetch("/final-score")

                .then(response => response.json())

                .then(data => {

                    document.getElementById("progress").innerText =
                        "🎯 Interview Completed";

                    document.getElementById("question").innerText =
                        "Final Interview Score";

                    document.getElementById("answer").style.display =
                        "none";

                    document.querySelector("button").style.display =
                        "none";

                    document.getElementById("result").innerText =
                        `🎯 FINAL SCORE: ${data.score}/10\n\n` +
                        `Questions Answered: ${data.answered}/${data.total}`;

                });
        }


        // Start interview
        loadQuestion();

    </script>

</body>

</html>
